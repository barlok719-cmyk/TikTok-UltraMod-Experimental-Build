name: Import experimental branch from private source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DESTINATION_REPO_TOKEN }}
          persist-credentials: true

      - name: Clone private experimental branch
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_REPO_TOKEN" ]; then
            echo "::error::Add SOURCE_REPO_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          fi
          SOURCE_DIR="$RUNNER_TEMP/tiktok-ultramod-source"
          rm -rf "$SOURCE_DIR"
          git clone --depth 1 --single-branch --branch ultramod/experimental \
            "https://barlok719-cmyk:${SOURCE_REPO_TOKEN}@github.com/barlok719-cmyk/tiktok-rv-private.git" "$SOURCE_DIR"

      - name: Copy experimental source tree
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/tiktok-ultramod-source"
          test -d "$SOURCE_DIR/.git"
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/import-experimental.yml' --exclude='revanced-patches/local.properties' "$SOURCE_DIR/" "$GITHUB_WORKSPACE/"
          test -f .github/workflows/tiktok-patcher.yml
          test -f revanced-patches/settings.gradle.kts
          test -d revanced-patches/patches
          echo "Source tree copied and required project files verified."

      - name: Commit imported tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Destination already matches the experimental branch."
            exit 0
          fi
          git commit -m "Import ultramod/experimental source tree"
          git push origin HEAD:main
