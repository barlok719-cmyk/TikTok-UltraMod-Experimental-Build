name: ICQ DM Incoming Renderer Analysis

on:
  push:
    branches:
      - icq-analysis-runner
    paths:
      - ".github/workflows/icq-dm-incoming-analysis.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect-incoming-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated analysis branch
        uses: actions/checkout@v4

      - name: Locate latest successful experimental APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow tiktok-patcher.yml \
            --branch ultramod/experimental-full-build \
            --status success --limit 20 \
            --json databaseId --jq '.[0].databaseId')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful experimental build run found."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/tiktok-apk"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name tiktok-ultramod-apk --dir "$RUNNER_TEMP/tiktok-apk"
          mapfile -t APKS < <(find "$RUNNER_TEMP/tiktok-apk" -type f -name '*.apk')
          if [ "${#APKS[@]}" -ne 1 ]; then
            printf 'Expected exactly one APK, found %s\n' "${#APKS[@]}"
            find "$RUNNER_TEMP/tiktok-apk" -maxdepth 3 -type f -printf '%p (%s bytes)\n'
            exit 1
          fi
          test -s "${APKS[0]}"
          echo "apk_path=${APKS[0]}" >> "$GITHUB_OUTPUT"
          echo "build_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          ls -lh "${APKS[0]}"

      - name: Checkout private ICQ research tools
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_REPO_TOKEN:-}" ]; then
            echo "::error::SOURCE_REPO_TOKEN secret is missing in this public repository."
            exit 1
          fi
          AUTH="$(printf 'x-access-token:%s' "$SOURCE_REPO_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" clone \
            --filter=blob:none --depth 1 --single-branch \
            --branch ultramod/next \
            https://github.com/barlok719-cmyk/tiktok-rv-private.git \
            "$RUNNER_TEMP/icq-research-source"
          test -s "$RUNNER_TEMP/icq-research-source/tools/icq_smiles/analyze_dm_stickers.py"

      - name: Set up Python and Java
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download pinned baksmali toolchain
        shell: bash
        run: |
          set -euo pipefail
          wget https://repo1.maven.org/maven2/org/apktool/apktool-cli/3.0.3/apktool-cli-3.0.3.jar \
            -O "$RUNNER_TEMP/apktool-cli.jar"
          test -s "$RUNNER_TEMP/apktool-cli.jar"

      - name: Trace incoming TextContent to its message cell
        timeout-minutes: 75
        env:
          JAVA_TOOL_OPTIONS: "-Xms512m -Xmx6g -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u "$RUNNER_TEMP/icq-research-source/tools/icq_smiles/analyze_dm_stickers.py" \
            --apk "${{ steps.apk.outputs.apk_path }}" \
            --smali-jar "$RUNNER_TEMP/apktool-cli.jar" \
            --output "$RUNNER_TEMP/icq-dm-incoming-analysis.md" \
            --api 35
          {
            echo "# Analysis provenance"
            echo
            echo "- APK source repository: $GITHUB_REPOSITORY"
            echo "- APK build branch: ultramod/experimental-full-build"
            echo "- APK build run: ${{ steps.apk.outputs.build_run_id }}"
            echo "- Analyzer source: private repository branch ultramod/next"
            echo "- Analysis branch: icq-analysis-runner"
            echo "- Static DEX analysis only; no APK patching or rebuilding."
          } > "$RUNNER_TEMP/icq-dm-incoming-source.md"

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: icq-dm-incoming-renderer-analysis
          path: |
            ${{ runner.temp }}/icq-dm-incoming-analysis.md
            ${{ runner.temp }}/icq-dm-incoming-source.md
          if-no-files-found: error
          retention-days: 30
