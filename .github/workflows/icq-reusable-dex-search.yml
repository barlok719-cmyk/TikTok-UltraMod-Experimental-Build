name: ICQ Reusable DEX Search Database

on:
  workflow_dispatch:
    inputs:
      terms:
        description: "Search terms separated by semicolons"
        required: true
        default: "GifContent;LightInteractionGiphyMessage;LEGACY_MESSAGE_TYPE_EMOJI;LX/0Dyb;LX/0YpJ;LX/0Exc;BaseContentParserKt;getOrParseJsonContent;stickerId;GifContent;ChatroomEmojiPanelAssem;CommentEmojiPanelAssem;EmojiInputViewImplV2;IMStickerInputPanelService;StickerPanelAssemViewModel;LX/0kOo;LX/0NKm;LX/0fuk;sendMessage;SendMessage;upload;message content;TextContent;TextReceivePowerCell;MessageListSubmitListAbilityImpl;MessageListComponentFactoryImpl;setText;TuxTextView"
        type: string
  push:
    branches:
      - icq-search-database
    paths:
      - ".github/workflows/icq-reusable-dex-search.yml"
      - "tools/icq/build_search_database.py"

permissions:
  actions: read
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Locate latest successful experimental APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tiktok-patcher.yml --branch ultramod/experimental-full-build --status success --limit 20 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID" && test "$RUN_ID" != null
          mkdir -p "$RUNNER_TEMP/apk"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name tiktok-ultramod-apk --dir "$RUNNER_TEMP/apk"
          mapfile -t APKS < <(find "$RUNNER_TEMP/apk" -type f -name '*.apk')
          test "${#APKS[@]}" -eq 1
          APK_SHA="$(sha256sum "${APKS[0]}" | awk '{print $1}')"
          echo "apk_path=${APKS[0]}" >> "$GITHUB_OUTPUT"
          echo "build_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
      - name: Restore decoded DEX database
        id: dex-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/icq-smali-db
          key: icq-smali-v1-${{ steps.apk.outputs.apk_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download pinned apktool with retry
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fL --retry 2 --retry-delay 3 https://repo.maven.apache.org/maven2/org/apktool/apktool-cli/3.0.3/apktool-cli-3.0.3.jar -o "$RUNNER_TEMP/apktool-cli.jar"; then break; fi
            sleep $((i*5))
          done
          test -s "$RUNNER_TEMP/apktool-cli.jar"
      - name: Build or reuse decoded DEX database and search
        env:
          JAVA_TOOL_OPTIONS: "-Xms512m -Xmx6g -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
          TERMS: ${{ inputs.terms || 'LX/1E00;LX/0YtY;LX/0N4f;LX/0EpN;BaseContentParserKt;TextContent;MessageListSubmitListAbilityImpl;MessageListComponentFactoryImpl;TextReceivePowerCell;TextBigEmojiReceivePowerCell;TextTranslateReceiveCell;MarkdownReceiverPowerCell;LX/1E00;->LIZJ;LX/0YtY;->LIZ;BaseContentParserKt;->getOrParseJsonContent;getOrParseJsonContent;getRichTextInfos;getText;setText;TuxTextView' }}
          FOCUS_CLASSES: 'LX/0Dyb;LX/0YpJ;LX/0Exc;LX/0kOo;LX/0NKm;LX/0fuk;LX/0Etl;LX/0EpN;LX/0Yok;LX/0Yol;LX/0Yom;LX/0Yon;LX/0Ymv;LX/0NAI;LX/0NAJ;LX/0NBI;LX/0NAA;LX/0NAF;LX/0YtY;LX/1E00;com/ss/android/ugc/aweme/im/message/content/GifContent;com/ss/android/ugc/aweme/im/message/content/TextContent;com/ss/android/ugc/aweme/im/messagelist/provider/MessageListComponentFactoryImpl;com/ss/android/ugc/aweme/im/messagelist/ui/MessageListSubmitListAbilityImpl'
        run: |
          set -euo pipefail
          if [ -n "$(find "$RUNNER_TEMP/icq-smali-db" -name .complete -print -quit 2>/dev/null || true)" ]; then
            echo "Decoded DEX cache found. Reusing it; no APK disassembly."
          else
            echo "No decoded DEX cache found. This run will create it once."
          fi
          python3 -u tools/icq/build_search_database.py \
            --apk "${{ steps.apk.outputs.apk_path }}" \
            --jar "$RUNNER_TEMP/apktool-cli.jar" \
            --db "$RUNNER_TEMP/icq-smali-db" \
            --terms "$TERMS" \
            --focus-classes "$FOCUS_CLASSES" \
            --output "$RUNNER_TEMP/search-results" \
            --api 35
      - uses: actions/upload-artifact@v4
        with:
          name: icq-multi-target-search-${{ github.run_id }}
          path: ${{ runner.temp }}/search-results/
          if-no-files-found: error
          retention-days: 30
