name: ICQ DM Full Protocol And Renderer Trace

on:
  workflow_dispatch:
  push:
    branches:
      - icq-text-renderer-trace

permissions:
  actions: read
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Locate latest successful experimental APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tiktok-patcher.yml --branch ultramod/experimental-full-build --status success --limit 20 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID" && test "$RUN_ID" != null
          mkdir -p "$RUNNER_TEMP/apk"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name tiktok-ultramod-apk --dir "$RUNNER_TEMP/apk"
          mapfile -t APKS < <(find "$RUNNER_TEMP/apk" -type f -name '*.apk')
          test "${#APKS[@]}" -eq 1
          echo "apk_path=${APKS[0]}" >> "$GITHUB_OUTPUT"
          echo "build_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Checkout private research source
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$SOURCE_REPO_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" clone --filter=blob:none --depth 1 --single-branch --branch ultramod/next https://github.com/barlok719-cmyk/tiktok-rv-private.git "$RUNNER_TEMP/private"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download pinned apktool
        run: wget https://repo1.maven.org/maven2/org/apktool/apktool-cli/3.0.3/apktool-cli-3.0.3.jar -O "$RUNNER_TEMP/apktool-cli.jar"
      - name: Run exhaustive protocol, PowerCell and text-renderer trace
        timeout-minutes: 105
        env:
          JAVA_TOOL_OPTIONS: "-Xms512m -Xmx6g -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
        run: |
          set -euo pipefail
          python3 -u "$RUNNER_TEMP/private/tools/icq_smiles/analyze_dm_stickers.py" \
            --apk "${{ steps.apk.outputs.apk_path }}" \
            --smali-jar "$RUNNER_TEMP/apktool-cli.jar" \
            --output "$RUNNER_TEMP/trace/icq-dm-full-protocol-renderer-trace.md" \
            --api 35
          printf '%s\n' \
            "APK from ultramod/experimental-full-build; analyzer from private ultramod/next;" \
            "public analysis branch icq-text-renderer-trace; static DEX analysis only;" \
            "no APK modification, patching, rebuild, or working-branch changes." \
            > "$RUNNER_TEMP/trace/provenance.md"
      - uses: actions/upload-artifact@v4
        with:
          name: icq-dm-full-protocol-renderer-trace
          path: ${{ runner.temp }}/trace/
          if-no-files-found: error
          retention-days: 30
