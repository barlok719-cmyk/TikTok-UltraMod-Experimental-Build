name: ICQ DM Text Renderer Trace

on:
  push:
    branches:
      - icq-text-renderer-trace
    paths:
      - ".github/workflows/icq-text-renderer-trace.yml"

permissions:
  actions: read
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Locate latest successful experimental APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tiktok-patcher.yml --branch ultramod/experimental-full-build --status success --limit 20 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID" && test "$RUN_ID" != null
          mkdir -p "$RUNNER_TEMP/apk"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name tiktok-ultramod-apk --dir "$RUNNER_TEMP/apk"
          mapfile -t APKS < <(find "$RUNNER_TEMP/apk" -type f -name '*.apk')
          test "${#APKS[@]}" -eq 1
          echo "apk_path=${APKS[0]}" >> "$GITHUB_OUTPUT"
          echo "build_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Checkout private research source
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$SOURCE_REPO_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" clone --filter=blob:none --depth 1 --single-branch --branch ultramod/next https://github.com/barlok719-cmyk/tiktok-rv-private.git "$RUNNER_TEMP/private"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download pinned apktool
        run: wget https://repo1.maven.org/maven2/org/apktool/apktool-cli/3.0.3/apktool-cli-3.0.3.jar -O "$RUNNER_TEMP/apktool-cli.jar"
      - name: Trace renderer and view binding
        timeout-minutes: 75
        env:
          JAVA_TOOL_OPTIONS: "-Xms512m -Xmx6g -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/trace.py" <<'PY'
          import os,re,zipfile,tempfile,subprocess
          from pathlib import Path
          apk=Path("${{ steps.apk.outputs.apk_path }}")
          jar=Path(os.environ["RUNNER_TEMP"])/"apktool-cli.jar"
          out=Path(os.environ["RUNNER_TEMP"])/"trace"
          out.mkdir()
          targets=("TextTranslateReceiveCell","TextTranslateReceiveAssem","TextTranslateSendCell","TextTranslateAssem","TextContent","0NHW","0NHV","0Yp0","0NHc","0NHd")
          class_rx=re.compile(r"^\\.class\\b.*?\\s(L[^;]+;)")
          method_rx=re.compile(r"^\\.method\\b")
          classes={}
          callers=[]
          text_ui=[]
          with zipfile.ZipFile(apk) as z, tempfile.TemporaryDirectory() as td:
            dexes=[n for n in z.namelist() if re.fullmatch(r"classes(?:[2-9]|[1-9][0-9]+)?\\.dex",Path(n).name) and "/" not in n]
            for i,name in enumerate(dexes):
              dex=Path(td)/f"d{i}.dex"; dest=Path(td)/f"s{i}"; dex.write_bytes(z.read(name))
              p=subprocess.run(["java","-Xmx4g","-cp",str(jar),"com.android.tools.smali.baksmali.Main","d","-a","35","-j","4","-o",str(dest),str(dex)],capture_output=True,text=True)
              if p.returncode: raise RuntimeError(p.stdout+p.stderr)
              for f in dest.rglob("*.smali"):
                try: lines=f.read_text(errors="ignore").splitlines()
                except: continue
                desc=""; methods=[]; cur=None
                for line in lines:
                  m=class_rx.match(line)
                  if m: desc=m.group(1)
                  if method_rx.match(line):
                    if cur: methods.append(cur)
                    cur=[line]
                  elif cur:
                    cur.append(line)
                    if line.startswith(".end method"):
                      methods.append(cur); cur=None
                if cur: methods.append(cur)
                simple=desc.rsplit("/",1)[-1].rstrip(";") if desc else f.stem
                if any(t in simple for t in targets):
                  classes[(name,simple)]="\\n".join(lines)
                for body in methods:
                  txt="\\n".join(body)
                  if any(t in txt for t in targets):
                    callers.append((name,desc,body))
                  if ("/im/" in (desc or "") and ("TextContent;" in txt or "getText()Ljava/lang/String;" in txt) and re.search(r"(?:TextView|TuxTextView|AppCompatTextView);->setText\\(|setText\\(|SpannableString|setSpan\\(",txt)):
                    text_ui.append((name,desc,body))
          report=[]
          report.append("# Focused DM text renderer trace\\n")
          report.append(f"- APK: {apk.name}\\n- DEX files: {len(dexes)}\\n- Target class dumps: {len(classes)}\\n- Methods referencing target symbols: {len(callers)}\\n- IM text/UI candidates: {len(text_ui)}\\n")
          report.append("\\n## Target class bodies\\n")
          for (dex,simple),body in sorted(classes.items()):
            report.append(f"\\n### {simple} ({dex})\\n\\n\x60\x60\x60smali\\n{body}\\n\x60\x60\x60\\n")
          report.append("\\n## Call sites referencing target symbols\\n")
          for dex,desc,body in callers:
            report.append(f"\\n### {desc} ({dex})\\n\\n\x60\x60\x60smali\\n"+"\\n".join(body)+"\\n\x60\x60\x60\\n")
          report.append("\\n## TextContent + UI setter candidates under IM packages\\n")
          for dex,desc,body in text_ui:
            report.append(f"\\n### {desc} ({dex})\\n\\n\x60\x60\x60smali\\n"+"\\n".join(body)+"\\n\x60\x60\x60\\n")
          (out/"icq-dm-text-renderer-trace.md").write_text("".join(report))
          (out/"provenance.md").write_text("APK from ultramod/experimental-full-build; analyzer tools from private ultramod/next; branch icq-text-renderer-trace; static analysis only; no APK modification or rebuild.")
          PY
          python3 -u "$RUNNER_TEMP/trace.py"
      - uses: actions/upload-artifact@v4
        with:
          name: icq-dm-text-renderer-trace
          path: ${{ runner.temp }}/trace/
          if-no-files-found: error
          retention-days: 30
